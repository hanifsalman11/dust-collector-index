name: Autonomous Woodshop Dust Collector CFM & Duct Sizing Engine

on:
  schedule:
    - cron: '38 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_dust:
        description: 'Optional Machine or Dust Collector Model (e.g. Laguna C|Flux 1.5HP or DeWalt DW735)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-dust-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Dust Collector Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_DUST: ${{ github.event.inputs.custom_dust || '' }}
        run: |
          python engine/dust_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_collectors.json
          if git diff --staged --quiet; then
            echo "No new dust collector calculator pages to commit."
          else
            git commit -m "chore(dust): auto-publish new woodshop dust collector CFM calculators"
            git push origin main
          fi
